# Starship Prompt Configuration
# Works with all terminals - provides a status-bar-like prompt
# Install: brew install starship
# https://starship.rs

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Catppuccin Mocha Palette
palette = "catppuccin_mocha"

# Format of the prompt
format = """
[╭─](mauve)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$aws\
$docker_context\
$kubernetes\
$line_break\
[╰─](mauve)$character"""

# Right-side format (status bar elements)
right_format = """$cmd_duration\
$time\
$battery"""

# Continuation prompt
continuation_prompt = "[∙](mauve) "

# General settings
add_newline = true
command_timeout = 1000

# ============================================================================
# Prompt Elements
# ============================================================================

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vicmd_symbol = "[V](bold yellow)"

[username]
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style) "
disabled = false
show_always = false

[hostname]
ssh_only = true
format = "on [$hostname](bold yellow) "
disabled = false

[directory]
format = "in [$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
read_only = " 🔒"
home_symbol = "~"

[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "⚔️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold green"

[python]
format = "via [$symbol$pyenv_prefix($version )]($style)"
symbol = " "
style = "bold yellow"

[rust]
format = "via [$symbol($version )]($style)"
symbol = "🦀 "
style = "bold red"

[golang]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold cyan"

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
symbol = "☁️  "
style = "bold yellow"
disabled = false

[docker_context]
format = "via [$symbol$context]($style) "
symbol = "🐳 "
style = "bold blue"

[kubernetes]
format = 'on [⛵ ($user on )($cluster in )$context \($namespace\)](bold cyan) '
disabled = false

[cmd_duration]
min_time = 500
format = "took [$duration](bold yellow) "
show_milliseconds = false

[time]
disabled = false
format = "[$time]($style) "
style = "bold white"
time_format = "%H:%M:%S"

[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "🔋"
unknown_symbol = "❓"
empty_symbol = "🪫"
disabled = false

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"

# ============================================================================
# Language-specific settings
# ============================================================================

[java]
symbol = " "

[lua]
symbol = " "

[php]
symbol = " "

[ruby]
symbol = " "

[swift]
symbol = "ﯣ "

[terraform]
format = "via [$symbol$workspace]($style) "

