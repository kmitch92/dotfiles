# Starship Prompt Configuration
# Works with all terminals - provides a status-bar-like prompt
# Install: brew install starship
# https://starship.rs

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Gruvbox Dark Hard Palette
palette = "gruvbox"

# Format of the prompt (Gruvbox Powerline, single-line)
format = """
[](fg:surface)\
$username\
[](fg:surface bg:blue)\
$directory\
[](fg:blue bg:orange)\
$git_branch\
$git_status\
[](fg:orange bg:surface)\
$nodejs\
$python\
$rust\
$golang\
[](fg:surface bg:yellow)\
$cmd_duration\
[](fg:yellow)\
$line_break\
$character"""

# Right-side format (status bar elements)
right_format = """$custom\
$time\
$battery"""

# Continuation prompt
continuation_prompt = "[∙](orange) "

# General settings
add_newline = true
command_timeout = 1000

# ============================================================================
# Prompt Elements
# ============================================================================

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vicmd_symbol = "[V](bold yellow)"

[username]
style_user = "fg:fg bg:surface"
style_root = "fg:red bg:surface"
format = "[ $user ]($style)"
disabled = false
show_always = true

[hostname]
ssh_only = true
format = "[ $hostname ](fg:fg bg:surface)"
disabled = false

[directory]
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "fg:bg bg:blue"
read_only_style = "fg:bg bg:blue"
truncation_length = 3
truncate_to_repo = true
read_only = " 🔒"
home_symbol = "~"

[git_branch]
format = "[ $symbol$branch(:$remote_branch) ]($style)"
symbol = " "
style = "fg:bg bg:orange"

[git_status]
format = '[ $all_status$ahead_behind ]($style)'
style = "fg:bg bg:orange"
conflicted = "⚔️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
format = "[ $symbol($version) ]($style)"
symbol = " "
style = "fg:green bg:surface"

[python]
format = "[ $symbol$pyenv_prefix($version) ]($style)"
symbol = " "
style = "fg:yellow bg:surface"

[rust]
format = "[ $symbol($version) ]($style)"
symbol = "🦀 "
style = "fg:red bg:surface"

[golang]
format = "[ $symbol($version) ]($style)"
symbol = " "
style = "fg:aqua bg:surface"

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
symbol = "☁️  "
style = "bold yellow"
disabled = false

[docker_context]
format = "via [$symbol$context]($style) "
symbol = "🐳 "
style = "bold blue"

[kubernetes]
format = 'on [⛵ ($user on )($cluster in )$context \($namespace\)](bold cyan) '
disabled = false

[cmd_duration]
min_time = 500
format = "[  $duration ](fg:bg bg:yellow)"
show_milliseconds = false

[time]
disabled = false
format = "[ $time ]($style)"
style = "fg:fg bg:surface"
time_format = "%H:%M:%S"

[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "🔋"
unknown_symbol = "❓"
empty_symbol = "🪫"
disabled = false

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"

# ============================================================================
# Language-specific settings
# ============================================================================

[java]
symbol = " "

[lua]
symbol = " "

[php]
symbol = " "

[ruby]
symbol = " "

[swift]
symbol = "ﯣ "

[terraform]
format = "via [$symbol$workspace]($style) "

# ============================================================================
# Gruvbox Dark Hard Color Palette
# ============================================================================

[palettes.gruvbox]
bg = "#1d2021"
fg = "#ebdbb2"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#458588"
purple = "#d3869b"
magenta = "#d3869b"
aqua = "#8ec07c"
cyan = "#8ec07c"
orange = "#fe8019"
gray = "#928374"
surface = "#3c3836"
overlay = "#504945"

