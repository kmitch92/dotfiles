# Kitty Terminal Configuration
# https://sw.kovidgoyal.net/kitty/conf/

# Font Configuration
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0

# Disable ligatures
disable_ligatures always

# Cursor
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# Mouse
mouse_hide_wait 3.0
url_style curly
copy_on_select yes

# Window
remember_window_size  yes
initial_window_width  1200
initial_window_height 800
window_padding_width 10
hide_window_decorations no
background_opacity 0.95
background_blur 20

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# macOS specific
macos_option_as_alt yes
macos_titlebar_color background
macos_show_window_title_in all
macos_quit_when_last_window_closed yes

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Shell
shell_integration enabled

# Gruvbox Dark Hard Theme
foreground              #ebdbb2
background              #1d2021
selection_foreground    #1d2021
selection_background    #ebdbb2

# Cursor colors
cursor                  #ebdbb2
cursor_text_color       #1d2021

# URL underline color when hovering with mouse
url_color               #fe8019

# Tab bar colors
active_tab_foreground   #1d2021
active_tab_background   #fe8019
inactive_tab_foreground #a89984
inactive_tab_background #282828
tab_bar_background      #1d2021

# Marks
mark1_foreground #1d2021
mark1_background #d3869b
mark2_foreground #1d2021
mark2_background #83a598
mark3_foreground #1d2021
mark3_background #8ec07c

# The 16 terminal colors

# black
color0 #282828
color8 #928374

# red
color1 #cc241d
color9 #fb4934

# green
color2  #98971a
color10 #b8bb26

# yellow
color3  #d79921
color11 #fabd2f

# blue
color4  #458588
color12 #83a598

# magenta
color5  #b16286
color13 #d3869b

# cyan
color6  #689d6a
color14 #8ec07c

# white
color7  #a89984
color15 #ebdbb2

# Key bindings
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+n new_os_window
map cmd+w close_window
map cmd+t new_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+plus change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+0 change_font_size all 0
