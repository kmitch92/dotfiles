# Tmux Configuration with Status Bar
# Works with: Ghostty, Alacritty, Kitty, and any terminal

# ============================================================================
# General Settings
# ============================================================================

# Use zsh as default shell
set-option -g default-shell /bin/zsh

# Enable 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Increase scrollback buffer
set -g history-limit 10000

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Automatic window renaming with abbreviated git repo/branch
set-option -g automatic-rename on
set-option -g automatic-rename-format '#(~/.config/tmux/scripts/tmux-window-name.sh "#{pane_current_path}")'

# Reduce escape time for faster command sequences
set -sg escape-time 10

# ============================================================================
# Key Bindings
# ============================================================================

# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode settings (vim-like)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ============================================================================
# Status Bar Configuration - Gruvbox Dark Hard Theme
# ============================================================================

# Status bar position
set-option -g status-position bottom

# Update status bar every second
set -g status-interval 1

# Status bar colors
set -g status-style bg=#282828,fg=#a89984

# Left side of status bar
set -g status-left-length 50
set -g status-left "#[fg=#1d2021,bg=#fe8019,bold] #S #[fg=#fe8019,bg=#3c3836] #[fg=#ebdbb2,bg=#3c3836] #(whoami) #[fg=#3c3836,bg=#282828]"

# Right side of status bar
set -g status-right-length 150
set -g status-right "#[fg=#3c3836,bg=#282828]#[fg=#ebdbb2,bg=#3c3836] %a %b %d #[fg=#928374,bg=#3c3836]│#[fg=#ebdbb2,bg=#3c3836] %H:%M:%S #[fg=#83a598,bg=#3c3836]#[fg=#1d2021,bg=#83a598,bold] #H "

# Window status
setw -g window-status-format "#[fg=#282828,bg=#3c3836]#[fg=#a89984,bg=#3c3836] #I:#W #[fg=#3c3836,bg=#282828]"
setw -g window-status-current-format "#[fg=#282828,bg=#fe8019]#[fg=#1d2021,bg=#fe8019,bold] #I:#W #[fg=#fe8019,bg=#282828]"

# Window status separator
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style fg=#3c3836
set -g pane-active-border-style fg=#fe8019

# Message style
set -g message-style bg=#3c3836,fg=#ebdbb2
set -g message-command-style bg=#3c3836,fg=#ebdbb2

# Window mode style
setw -g mode-style bg=#504945,fg=#ebdbb2

# Clock mode
setw -g clock-mode-colour "#fe8019"

# ============================================================================
# Plugins
# ============================================================================
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Install plugins: prefix + I (capital i)
# Update plugins: prefix + U
# Uninstall plugins: prefix + alt + u

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session management
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Clipboard integration
set -g @plugin 'tmux-plugins/tmux-yank'

# Open files/URLs
set -g @plugin 'tmux-plugins/tmux-open'

# Plugin configurations
set -g @continuum-restore 'on'                    # Auto-restore sessions
set -g @continuum-save-interval '15'              # Save every 15 minutes
set -g @resurrect-capture-pane-contents 'on'      # Save pane contents
set -g @yank_action 'copy-pipe-no-clear'          # Don't exit copy mode after yank

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
