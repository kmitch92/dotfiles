# Tmux Configuration with Status Bar
# Works with: Ghostty, Alacritty, Kitty, and any terminal

# ============================================================================
# General Settings
# ============================================================================

# Use zsh as default shell
set-option -g default-shell /bin/zsh

# Enable 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Increase scrollback buffer
set -g history-limit 10000

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Automatic window renaming with abbreviated git repo/branch
set-option -g automatic-rename on
set-option -g automatic-rename-format '#(~/.config/tmux/scripts/tmux-window-name.sh "#{pane_current_path}")'

# Reduce escape time for faster command sequences
set -sg escape-time 10

# ============================================================================
# Key Bindings
# ============================================================================

# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode settings (vim-like)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ============================================================================
# Status Bar Configuration - Catppuccin Mocha Theme
# ============================================================================

# Status bar position
set-option -g status-position bottom

# Update status bar every second
set -g status-interval 1

# Status bar colors
set -g status-style bg=#1e1e2e,fg=#cdd6f4

# Left side of status bar
set -g status-left-length 50
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#313244] #[fg=#cdd6f4,bg=#313244] #(whoami) #[fg=#313244,bg=#1e1e2e]"

# Right side of status bar
set -g status-right-length 150
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] %a %b %d #[fg=#45475a,bg=#313244]│#[fg=#cdd6f4,bg=#313244] %H:%M:%S #[fg=#89b4fa,bg=#313244]#[fg=#11111b,bg=#89b4fa,bold] #H "

# Window status
setw -g window-status-format "#[fg=#1e1e2e,bg=#313244]#[fg=#cdd6f4,bg=#313244] #I:#W #[fg=#313244,bg=#1e1e2e]"
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#f5c2e7]#[fg=#11111b,bg=#f5c2e7,bold] #I:#W #[fg=#f5c2e7,bg=#1e1e2e]"

# Window status separator
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#cba6f7

# Message style
set -g message-style bg=#313244,fg=#cdd6f4
set -g message-command-style bg=#313244,fg=#cdd6f4

# Window mode style
setw -g mode-style bg=#585b70,fg=#cdd6f4

# Clock mode
setw -g clock-mode-colour "#89b4fa"

